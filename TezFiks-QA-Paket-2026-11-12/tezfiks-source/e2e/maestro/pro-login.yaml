appId: az.tezfiks.usta
name: TezFiks Usta - log in with a demo phone (Azerbaijani UI)
env:
  PHONE: "502000001"
  CODE: "123456"
---
- launchApp:
    clearState: true
- tapOn:
    text: "While using the app"
    optional: true
- extendedWaitUntil:
    visible:
      id: "phone-screen"
    timeout: 30000
- tapOn:
    id: "language-picker-az"
- takeScreenshot: ${SIZE}-pro-01-login
- tapOn:
    id: "phone-input"
- inputText: ${PHONE}
# Submit with the keyboard (on small phones the keyboard can cover the Continue button).
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "otp-screen"
    timeout: 20000
- inputText: ${CODE}
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- tapOn:
    text: "Allow"
    optional: true
