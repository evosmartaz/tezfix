# TezFiks reverse proxy. Include these locations INSIDE the existing HTTPS server block for evosmart.az:
#
#   server {
#       listen 443 ssl http2;
#       server_name evosmart.az www.evosmart.az;
#       ...
#       include /etc/nginx/snippets/tezfiks.conf;
#   }
#
# Upstreams are the docker compose ports bound to 127.0.0.1 (API_PORT=3300, PANEL_PORT=3310 in deploy/.env).
#
# Client addresses: evosmart.az is proxied by Cloudflare. tezfiks-cloudflare-realip.conf (written by
# deploy/nginx/cloudflare-realip.sh) restores the visitor's address from CF-Connecting-IP, only for requests that
# really come from a Cloudflare range and only inside these locations. The API receives exactly that one address
# in X-Forwarded-For (never a client-supplied chain), so per-IP login limits apply per visitor.

# Socket.IO (live tracking, offers, chat): WebSocket upgrade and long timeouts.
location ^~ /tezfix/api/socket.io/ {
    include /etc/nginx/snippets/tezfiks-cloudflare-realip.conf;
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# REST API (mobile apps, test-mode checkout pages, signed file URLs).
location ^~ /tezfix/api/ {
    include /etc/nginx/snippets/tezfiks-cloudflare-realip.conf;
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 10m;
    proxy_read_timeout 60s;
}

# Web panels (Next.js, basePath /tezfix): /tezfix/admin, /tezfix/company, /tezfix/join/<token>, /tezfix/bff/*.
location ^~ /tezfix/ {
    include /etc/nginx/snippets/tezfiks-cloudflare-realip.conf;
    proxy_pass http://127.0.0.1:3310;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 10m;
    proxy_read_timeout 120s;
}

location = /tezfix {
    return 301 /tezfix/admin;
}
