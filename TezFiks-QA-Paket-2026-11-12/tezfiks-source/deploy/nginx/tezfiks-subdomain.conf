# TezFiks panels on their own subdomain: https://tezfiks.evosmart.az (opens the TezFiks admin panel).
# Self-contained vhost (same pattern as bexsis.evosmart.az); it does not touch the evosmart.az default_server blocks.
# Install as /etc/nginx/sites-available/tezfiks and symlink it into sites-enabled.
#
# TLS: Let's Encrypt, issued like the other evosmart.az certificates:
#   certbot certonly --standalone --http-01-port 8888 --http-01-address 127.0.0.1 -d tezfiks.evosmart.az
# The :80 block passes ACME challenges to certbot's loopback port, so renewals (certbot.timer) never stop nginx.
#
# The panels are built with basePath /tezfix, so pages live under /tezfix/... here too; the site root redirects to the
# admin login. The API and Socket.IO locations come from the shared snippet (the panel's live updates connect to
# /tezfix/api/socket.io on the same origin).

server {
    listen 80;
    listen [::]:80;
    server_name tezfiks.evosmart.az;
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8888;
    }
    location / {
        return 301 https://tezfiks.evosmart.az$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tezfiks.evosmart.az;
    ssl_certificate     /etc/letsencrypt/live/tezfiks.evosmart.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tezfiks.evosmart.az/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:TezfiksSSL:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    # Renewals through Cloudflare can arrive here when http is redirected to https at the edge.
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8888;
    }

    # /tezfix/api/socket.io/, /tezfix/api/, /tezfix/ (panels) and /tezfix -> /tezfix/admin.
    include /etc/nginx/snippets/tezfiks.conf;

    # App downloads until the Play Store listings exist: deploy/web/download/index.html + tezfiks.apk / tezfiks-usta.apk,
    # copied to /var/www/tezfiks/download on the server.
    location = /download {
        return 301 /download/;
    }
    location /download/ {
        alias /var/www/tezfiks/download/;
        index index.html;
        types { text/html html; application/vnd.android.package-archive apk; }
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    location / {
        return 302 /tezfix/admin;
    }
}
