# Local development databases. Ports bind to localhost only.
name: tezfiks-dev
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: tezfiks
      POSTGRES_PASSWORD: tezfiks
      POSTGRES_DB: tezfiks
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ['postgres', '-c', 'max_connections=300']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tezfiks -d tezfiks']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction', '--databases', '64']
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
